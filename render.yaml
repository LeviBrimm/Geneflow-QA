services:
  - type: web
    name: geneflow-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geneflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: geneflow-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_MODE
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: EXTERNAL_REFERENCE_MODE
        value: mock
      - key: EXTERNAL_REFERENCE_BASE_URL
        value: https://rest.ensembl.org
      - key: EXTERNAL_REFERENCE_TIMEOUT_SECONDS
        value: "3"
      - key: CORS_ORIGINS
        sync: false
      - key: ANALYSIS_QUEUE_NAME
        value: analysis
      - key: ANALYSIS_QUEUE_MODE
        value: rq

  - type: worker
    name: geneflow-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    dockerCommand: python worker.py
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geneflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: geneflow-redis
          property: connectionString
      - key: AUTH_SECRET
        fromService:
          type: web
          name: geneflow-api
          envVarKey: AUTH_SECRET
      - key: AI_MODE
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: EXTERNAL_REFERENCE_MODE
        value: mock
      - key: EXTERNAL_REFERENCE_BASE_URL
        value: https://rest.ensembl.org
      - key: EXTERNAL_REFERENCE_TIMEOUT_SECONDS
        value: "3"
      - key: ANALYSIS_QUEUE_NAME
        value: analysis
      - key: ANALYSIS_QUEUE_MODE
        value: rq

  - type: web
    name: geneflow-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

  - type: keyvalue
    name: geneflow-redis
    ipAllowList:
      - source: 0.0.0.0/0
        description: deploy smoke tests and managed services

databases:
  - name: geneflow-db
    databaseName: geneflow
    user: geneflow
